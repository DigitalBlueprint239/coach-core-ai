name: Smart Playbook Research Integration Checks
on:
  push:
    branches:
      - feature/issue-112-inside-zone-draft-screen-v1
  pull_request:
    branches:
      - m2/inside-zone
permissions:
  contents: read
concurrency:
  group: playbook-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint app
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run UI and football-core unit tests
        run: npm test
      - name: Build Vite application (no deployment)
        run: npm run build
