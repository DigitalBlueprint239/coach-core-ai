name: Deploy production

# Replaces the live site (https://coach-core-ai.web.app) with a commit that is already on the recovery
# branch (normally the one running on staging). Run by hand only; the `production` environment requires the
# owner's approval before the job starts (owner action O3). Rollback steps: docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA on recovery/coach-core-mvp-2026 to release (the one on staging)'
        required: true
        type: string
      confirm:
        description: 'Type replace-live-site to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud; only usable once the production WIF provider trusts this job

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Set on the `production` environment once keyless deploys are provisioned (owner-approved step).
      # While they are empty the job uses the legacy JSON key below; nothing here creates or moves credentials.
      PROD_WIF_PROVIDER: ${{ vars.PROD_WIF_PROVIDER }}
      PROD_DEPLOY_SERVICE_ACCOUNT: ${{ vars.PROD_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check the request
        # Inputs are passed through env, never interpolated into the script.
        env:
          REF: ${{ inputs.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "replace-live-site" ]; then
            echo "::error::Type replace-live-site in the confirm box to deploy production."; exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is on the recovery branch
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch --no-tags origin recovery/coach-core-mvp-2026
          if ! git merge-base --is-ancestor "$REF" origin/recovery/coach-core-mvp-2026; then
            echo "::error::$REF is not on recovery/coach-core-mvp-2026. Only merged, staged commits can go live."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Verify production Firebase destination before build
        run: node scripts/assert-firebase-deploy-env.mjs production
        env:
          REACT_APP_DEPLOY_ENV: production
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}

      - name: Build
        run: npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          # Work-in-progress flags (REACT_APP_ENABLE_PLAYBOOK_V2, REACT_APP_ENABLE_CONTENT_REVIEW) stay unset:
          # off in production.
          REACT_APP_SENTRY_DSN: ${{ vars.REACT_APP_SENTRY_DSN }}
          REACT_APP_DEPLOY_ENV: production
          REACT_APP_RELEASE: ${{ inputs.ref }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Record the release request
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "### Production Hosting release"
            echo "- Commit: \`$REF\`"
            echo "- Requested by: $GITHUB_ACTOR (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Sign-in: $([ -n "$PROD_WIF_PROVIDER" ] && echo keyless || echo 'legacy JSON key (transitional)')"
            echo "- Scope: Hosting only. Rules, indexes and Functions are never deployed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # Keyless path: used as soon as the production environment defines PROD_WIF_PROVIDER.
      - name: Sign in to Google Cloud without a stored key
        if: ${{ vars.PROD_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: coach-core-ai
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Hosting only to the live site (keyless)
        if: ${{ vars.PROD_WIF_PROVIDER != '' }}
        run: npx --no-install firebase deploy --only hosting:production --project coach-core-ai --non-interactive

      # Transitional path: the JSON key that exists today. Remove this step, then revoke the key, only after a
      # keyless release has succeeded (docs/security/PRODUCTION_RELEASE_GOVERNANCE_2026-11-10.md, batch C).
      - name: Deploy Hosting only to the live site (legacy key)
        if: ${{ vars.PROD_WIF_PROVIDER == '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COACH_CORE_AI }}
          projectId: coach-core-ai
          target: production
          channelId: live
