name: Unit tests and build

# Runs the app's Jest suite (react-scripts) and a production build on every PR into the recovery branch,
# so changes are verified on GitHub's machines rather than a developer laptop.
on:
  pull_request:
    branches: [recovery/coach-core-mvp-2026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-and-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: 'true'

      - name: Production build
        # CI=false keeps existing lint warnings from failing the build; tighten once the warning backlog is cleared.
        run: npm run build
        env:
          CI: 'false'
