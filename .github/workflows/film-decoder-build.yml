name: Film decoder build (FILM-S2a)

# FILM-S2a: build the LGPL-only FFmpeg 9.0.2 validator binary from the
# signature-verified official tarball, prove the build is reproducible (two
# independent jobs must produce the same digest), run the isolation harness and
# the synthetic fixtures, and retain binary + provenance ONLY as a
# repository-scoped workflow artifact (14 days).
#
# This workflow never deploys, never publishes a release/package/image, never
# touches a bucket, never reads secrets, never runs the app or emulators, and
# never processes real footage. Fixtures are generated by the runner's distro
# FFmpeg (development-only generator, recorded in TOOLCHAIN.txt), never by the
# pinned binary and never shipped.

on:
  pull_request:
    paths:
      - 'tools/ffmpeg/**'
      - 'docs/film/DECODER_*.md'
      - '.github/workflows/film-decoder-build.yml'
  push:
    branches: ['s2a/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-decoder-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: '9.0.2'

jobs:
  build:
    name: Build ${{ matrix.id }} (independent, from verified source)
    # Pinned image (independent review F6): reproducibility is proven within one
    # image; ubuntu-latest is migrating to Ubuntu 26. SOURCE.json pins the
    # expected binary digests, so an image change fails loudly instead of drifting.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build dependencies (nasm for x86 asm; everything else is in the runner image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Verify source (PGP signature against the pinned FFmpeg release key, sha256)
        run: bash tools/ffmpeg/verify-source.sh "$RUNNER_TEMP/ffwork"
      - name: Build (LGPL-only minimal configure, static, stripped, reproducible flags; provenance validated before upload)
        run: bash tools/ffmpeg/build.sh "$RUNNER_TEMP/ffwork"
      - name: Record build ${{ matrix.id }}
        run: |
          echo "::notice title=Decoder build ${{ matrix.id }} (${{ github.sha }})::$(tr '\n' ' ' < "$RUNNER_TEMP/ffwork/provenance/BINARY_SHA256SUMS.txt") tarball=$(node -e "console.log(require('$RUNNER_TEMP/ffwork/provenance/source.json').tarballSha256)")"
          mkdir -p "$RUNNER_TEMP/upload"
          cp -r "$RUNNER_TEMP/ffwork/out" "$RUNNER_TEMP/ffwork/provenance" "$RUNNER_TEMP/upload/"
      - uses: actions/upload-artifact@v4
        with:
          name: decoder-build-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Reproducibility, isolation harness, synthetic fixtures
    needs: build
    # Pinned image (independent review F6): reproducibility is proven within one
    # image; ubuntu-latest is migrating to Ubuntu 26. SOURCE.json pins the
    # expected binary digests, so an image change fails loudly instead of drifting.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: decoder-build-a-${{ github.run_id }}
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@v4
        with:
          name: decoder-build-b-${{ github.run_id }}
          path: ${{ runner.temp }}/b
      - name: Provenance unit tests (writer/validator; regression for the c45319d build.json defect)
        run: node --test --test-reporter=spec tools/ffmpeg/provenance.test.mjs
      - name: Validate retained provenance of both builds (parse + assert before any further use)
        run: |
          set -euo pipefail
          node tools/ffmpeg/provenance.mjs validate "$RUNNER_TEMP/a"
          node tools/ffmpeg/provenance.mjs validate "$RUNNER_TEMP/b"
      - name: Reproducibility (two independent builds must be byte-identical)
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/a"; B="$RUNNER_TEMP/b"
          chmod +x "$A/out/bin/"* "$B/out/bin/"*
          cat "$A/provenance/BINARY_SHA256SUMS.txt" "$B/provenance/BINARY_SHA256SUMS.txt"
          if ! diff -q "$A/provenance/BINARY_SHA256SUMS.txt" "$B/provenance/BINARY_SHA256SUMS.txt"; then
            echo "::error title=Decoder NOT reproducible::build a and build b differ"; exit 1
          fi
          cmp "$A/out/bin/ffmpeg" "$B/out/bin/ffmpeg"; cmp "$A/out/bin/ffprobe" "$B/out/bin/ffprobe"
          TA=$(node -e "console.log(require('$A/provenance/source.json').tarballSha256)")
          TB=$(node -e "console.log(require('$B/provenance/source.json').tarballSha256)")
          [ "$TA" = "$TB" ] || { echo "::error title=Tarball digest differs between jobs::$TA vs $TB"; exit 1; }
          echo "::notice title=Decoder reproducible (${{ github.sha }})::$(tr '\n' ' ' < "$A/provenance/BINARY_SHA256SUMS.txt") tarball=$TA"
          file "$A/out/bin/ffmpeg"; (ldd "$A/out/bin/ffmpeg" || true)
      - name: Generator FFmpeg (development-only; never shipped) + prlimit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg util-linux
          ffmpeg -hide_banner -version | head -3
      - name: Frozen fixtures (committed, digest-verified) + fresh generation for within-run determinism
        run: |
          set -euo pipefail
          # 1. The FROZEN set under tools/ffmpeg/fixtures/frozen is what the harness and later S2b consume.
          (cd tools/ffmpeg/fixtures/frozen && sha256sum -c SHA256SUMS.txt --quiet)
          n=$(ls tools/ffmpeg/fixtures/frozen/*.mp4 tools/ffmpeg/fixtures/frozen/*.webm | wc -l)
          echo "::notice title=Frozen fixtures verified::$n files match tools/ffmpeg/fixtures/frozen/SHA256SUMS.txt; generator: $(head -1 tools/ffmpeg/fixtures/frozen/TOOLCHAIN.txt)"
          # 2. Fresh generation on this runner, twice: proves generate.sh is deterministic on one machine.
          #    Digests are NOT expected to equal the frozen set across machines (encoder CPU paths differ); that
          #    is why the set is frozen in git rather than regenerated per run.
          bash tools/ffmpeg/fixtures/generate.sh "$RUNNER_TEMP/fx1"
          bash tools/ffmpeg/fixtures/generate.sh "$RUNNER_TEMP/fx2"
          diff <(cd "$RUNNER_TEMP/fx1" && sha256sum *.mp4 *.webm | sort -k2) <(cd "$RUNNER_TEMP/fx2" && sha256sum *.mp4 *.webm | sort -k2)
          same=$(comm -12 <(sort tools/ffmpeg/fixtures/frozen/SHA256SUMS.txt) <(sort "$RUNNER_TEMP/fx1/SHA256SUMS.txt") | wc -l)
          echo "::notice title=Fresh generation deterministic on this runner::$(wc -l < "$RUNNER_TEMP/fx1/SHA256SUMS.txt") files; identical to frozen: $same (cross-machine equality not required); runner generator: $(head -1 "$RUNNER_TEMP/fx1/TOOLCHAIN.txt")"
      - name: Isolation harness against the pinned build (HARNESS_PINNED=1)
        env:
          FFMPEG_BIN: ${{ runner.temp }}/a/out/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/a/out/bin/ffprobe
          FIXTURES_DIR: ${{ github.workspace }}/tools/ffmpeg/fixtures/frozen
          HARNESS_PINNED: '1'
          HARNESS_RESULT: ${{ runner.temp }}/harness-result.json
        run: |
          set +e
          set -o pipefail
          node --test --test-reporter=spec tools/ffmpeg/harness/harness.test.mjs > "$RUNNER_TEMP/harness.log" 2>&1
          st=$?
          cat "$RUNNER_TEMP/harness.log"
          t=$(grep -E '^ℹ tests ' "$RUNNER_TEMP/harness.log" | awk '{print $3}'); p=$(grep -E '^ℹ pass ' "$RUNNER_TEMP/harness.log" | awk '{print $3}')
          f=$(grep -E '^ℹ fail ' "$RUNNER_TEMP/harness.log" | awk '{print $3}'); k=$(grep -E '^ℹ skipped ' "$RUNNER_TEMP/harness.log" | awk '{print $3}')
          echo "::notice title=Isolation harness (pinned build)::tests=${t:-?} pass=${p:-?} fail=${f:-?} skipped=${k:-?} exit=$st (skipped tests are NOT passes)"
          # Key pinned-build facts as annotations (reviewers without artifact access can read them).
          grep -E 'prlimit available|frame intervals|pinned decode refused|s11[abc]-.*: probe exit|DECODER ACCEPTED' "$RUNNER_TEMP/harness.log" \
            | sed -E 's/^[[:space:]]*ℹ[[:space:]]*//' | head -12 | tr '\n' ' ' | cut -c1-1800 | sed 's/^/::notice title=Harness key facts (pinned build)::/'; echo
          if [ "$st" != "0" ]; then
            # Surface failures as annotations (job logs are not reachable from every reviewer context).
            head -c 1200 "$RUNNER_TEMP/harness.log" | tr '\n' ' ' | sed 's/^/::error title=harness log head::/'; echo
            grep -E '^\s*✖ ' "$RUNNER_TEMP/harness.log" | sed 's/^\s*//' | sort -u | head -6 | while IFS= read -r l; do echo "::error title=harness failure::${l:0:300}"; done
            grep -E 'AssertionError|actual:|expected:|Error:' "$RUNNER_TEMP/harness.log" | head -10 | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=harness assertion detail::/'; echo
            grep -E '^\s*ℹ (decoders|encoders|demuxers|muxers|filters)' "$RUNNER_TEMP/harness.log" | head -8 | tr '\n' ' ' | cut -c1-1500 | sed 's/^/::error title=harness component lists::/'; echo
          fi
          exit "$st"
      - name: Assemble the retained artifact (binary + provenance + harness + fixture digests; nothing published)
        if: always()
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/film-decoder"; mkdir -p "$D/fixtures"
          STRICT="${{ job.status == 'success' }}"
          # On the success path every file is required; on the failure path keep whatever exists as evidence.
          c() { if [ "$STRICT" = "true" ]; then cp -r "$@"; else cp -r "$@" 2>/dev/null || true; fi; }
          c "$RUNNER_TEMP/a/out" "$RUNNER_TEMP/a/provenance" "$D/"
          c "$RUNNER_TEMP/b/provenance/BINARY_SHA256SUMS.txt" "$D/provenance/BINARY_SHA256SUMS.build-b.txt"
          c "$RUNNER_TEMP/b/provenance/build.json" "$D/provenance/build.build-b.json"
          c tools/ffmpeg/fixtures/frozen/SHA256SUMS.txt tools/ffmpeg/fixtures/frozen/TOOLCHAIN.txt "$D/fixtures/"
          c "$RUNNER_TEMP/fx1/SHA256SUMS.txt" "$D/fixtures/SHA256SUMS.runner-generated.txt"
          c "$RUNNER_TEMP/harness.log" "$RUNNER_TEMP/harness-result.json" "$D/"
          printf 'candidate=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\nrunner=%s/%s\njob_status=%s\n' "${{ github.sha }}" "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.event_name }}" "${ImageOS:-}" "${ImageVersion:-}" "${{ job.status }}" > "$D/RUN.txt"
          (cd "$D" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/ARTIFACT_SHA256SUMS.txt"
          mv "$RUNNER_TEMP/ARTIFACT_SHA256SUMS.txt" "$D/"
          if [ "$STRICT" = "true" ]; then
            # Validate the assembled artifact itself before upload: provenance parses and is
            # consistent, and the inventory covers every payload file.
            node tools/ffmpeg/provenance.mjs validate "$D"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' -- "$D/provenance/build.build-b.json"
            (cd "$D" && sha256sum -c ARTIFACT_SHA256SUMS.txt --quiet)
            n=$(cd "$D" && find . -type f ! -name ARTIFACT_SHA256SUMS.txt | wc -l); m=$(wc -l < "$D/ARTIFACT_SHA256SUMS.txt")
            [ "$n" = "$m" ] || { echo "::error title=Artifact inventory incomplete::$n payload files, $m inventory lines"; exit 1; }
            echo "::notice title=Retained artifact validated (${{ github.sha }})::$n payload files, inventory complete and verified; provenance valid"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: film-decoder-${{ env.FFMPEG_VERSION }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/film-decoder/
          if-no-files-found: error
          retention-days: 14
      # Failure evidence is kept too, but never under the name of a validated decoder artifact.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: film-decoder-FAILED-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/film-decoder/
          if-no-files-found: warn
          retention-days: 14
