name: E2E (emulator, real browsers)

# Real Chromium and Firefox against the local Firebase Emulator Suite with a
# demo-* project. No repository secrets, no real Firebase project, no AI
# provider: the gateway runs with COACH_CORE_AI_ENABLED=false and a
# placeholder key. Authentication is EMULATOR authentication (no real Google
# OAuth, no real email delivery). Never deploys.

on:
  pull_request:
    branches: [recovery/coach-core-mvp-2026]
  push:
    branches: ['claude/**', 'recovery/coach-core-mvp-2026']
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repeat each test N times (stability runs)'
        default: '1'
      grep:
        description: 'Optional test-title regex for targeted re-runs (empty = full suite)'
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # One job per Playwright project (2026-10-15). The union is the complete
    # matrix; nothing is filtered out. Split only because the full suite now
    # exceeds one job's existing 120-minute limit, which is NOT raised.
    name: E2E emulator (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, phone-chromium, phone-firefox]
    env:
      GCLOUD_PROJECT: demo-coach-core-e2e
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-e2e-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix e2e --no-audit --no-fund
      - name: Install browsers
        run: npx --prefix e2e playwright install --with-deps chromium firefox
      - name: Emulator-only function config (placeholders, AI off)
        run: |
          # Both files are git-ignored and exist only on this runner.
          # List params must be a JSON array in .env files; a bare URL fails to
          # parse and the gateway then refuses every browser origin (fail closed).
          printf 'COACH_CORE_AI_ENABLED=false\nCOACH_CORE_ALLOWED_ORIGINS=["http://localhost:3000"]\n' > functions/.env.local
          printf 'COACH_CORE_OPENAI_API_KEY=e2e-placeholder-not-a-key\n' > functions/.secret.local
      - name: Evidence self-checks (B15 retention contract)
        run: node e2e/scripts/evidence.test.mjs
      - name: Build web app for emulators (demo project)
        run: |
          npm --prefix e2e run build:app
          # B15 (2026-10-17): evidence that must survive the run lives in e2e/ci-evidence.
          # Playwright's "clear output" task deletes outputDir (e2e/test-results) at run
          # start, which previously destroyed run.log and the release manifest before upload.
          mkdir -p e2e/test-results e2e/ci-evidence
      - name: Release-build proof (no hooks / emulator wiring in a staging-shaped build)
        run: |
          RELEASE_BUILD_DIR=release-build RELEASE_MANIFEST=e2e/ci-evidence/release-build-manifest.sha256 \
            bash scripts/security/verify-release-build.sh coach-core-mvp-staging-239
      - name: Run browser tests in the emulator suite
        env:
          REPEAT: ${{ github.event.inputs.repeat_each || '1' }}
          # Passed as data via env (never interpolated into the shell command).
          E2E_GREP: ${{ github.event.inputs.grep || '' }}
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p e2e/test-results e2e/ci-evidence
          # evidence.sh tees to e2e/ci-evidence/run.log and exits with the TEST process's status.
          bash e2e/scripts/evidence.sh run e2e/ci-evidence -- \
            npx --prefix e2e firebase emulators:exec --project demo-coach-core-e2e \
            --only auth,firestore,functions \
            "npm --prefix e2e run test:browser -- --repeat-each=${REPEAT} --project=${PROJECT} --pass-with-no-tests"
      - name: Emulator diagnostics (functions load/requests, no secrets)
        if: always()
        run: |
          f=e2e/ci-evidence/run.log
          [ -f "$f" ] || exit 0
          d=$(grep -E "functions|coachAI|Loaded functions|params|secret|Error" "$f" | grep -v "^\s*$" | tail -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
          echo "::notice title=E2E emulator log (functions)::${d}"
      - name: Browser versions
        if: always()
        run: |
          v=$(cd e2e && node -e "const {chromium,firefox}=require('@playwright/test');(async()=>{for(const b of [chromium,firefox]){const x=await b.launch();console.log(b.name()+' '+x.version());await x.close()}})()" | tr '\n' ' ')
          echo "::notice title=E2E browsers::${v} (Playwright 1.64.0; Linux; desktop viewport; no physical devices)"
      - name: Finalize evidence (redact tokens, inventory with full SHA-256, fail if required evidence is missing)
        if: always()
        run: |
          bash e2e/scripts/evidence.sh finalize e2e/ci-evidence e2e/test-results \
            e2e/ci-evidence/run.log e2e/ci-evidence/release-build-manifest.sha256 e2e/test-results/results.json
          echo "::notice title=E2E evidence inventory (${{ matrix.project }})::$(grep -vc '^#' e2e/ci-evidence/INVENTORY.sha256) files; $(cat e2e/ci-evidence/REDACTION.txt 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.project }}-${{ github.sha }}
          path: |
            e2e/test-results
            e2e/ci-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
