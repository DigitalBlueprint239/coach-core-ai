name: E2E (emulator, real browsers)

# Real Chromium and Firefox against the local Firebase Emulator Suite with a
# demo-* project. No repository secrets, no real Firebase project, no AI
# provider: the gateway runs with COACH_CORE_AI_ENABLED=false and a
# placeholder key. Authentication is EMULATOR authentication (no real Google
# OAuth, no real email delivery). Never deploys.

on:
  pull_request:
    branches: [recovery/coach-core-mvp-2026]
    # ready_for_review added (merge-eligibility gate, 2026-10-17) so a draft promoted to
    # ready re-validates on its current head; the other three are GitHub's defaults.
    types: [opened, synchronize, reopened, ready_for_review]
  # merge_group only fires when a merge queue is enabled on the target branch (none is
  # configured today). Declared now so that, if the owner enables a queue, the queue's
  # candidate commit gets the same full validation and the same aggregate verdict.
  merge_group:
    types: [checks_requested]
  push:
    branches: ['claude/**', 'recovery/coach-core-mvp-2026']
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repeat each test N times (stability runs)'
        default: '1'
      grep:
        description: 'Optional test-title regex for targeted re-runs (empty = full suite)'
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # One job per Playwright project (2026-10-15) AND per result bucket (B11,
    # Coach Drew, 2026-10-16). The union of the twelve jobs is the complete
    # matrix: the three buckets partition every project's tests by title tag
    # (acceptance = untagged; diagnostic = "[diagnostic]"; obsolete-fault-model =
    # "[obsolete-fault-model]"), so nothing is filtered out, no assertion,
    # repetition or retries=0 setting changes, and the ACCEPTANCE job's
    # conclusion stands on its own. Diagnostic and obsolete results are still
    # published as annotations and artifacts and still investigated; they are
    # simply no longer able to turn the acceptance job red. Phone projects carry
    # no diagnostic/obsolete tests, so those jobs legitimately run zero tests
    # (--pass-with-no-tests). The existing 120-minute limit is NOT raised.
    # Branch-protection settings are not changed by this workflow.
    name: E2E ${{ matrix.bucket }} (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, phone-chromium, phone-firefox]
        bucket: [acceptance, diagnostic, obsolete-fault-model]
    env:
      GCLOUD_PROJECT: demo-coach-core-e2e
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-e2e-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix e2e --no-audit --no-fund
      - name: Install browsers
        run: npx --prefix e2e playwright install --with-deps chromium firefox
      - name: Emulator-only function config (placeholders, AI off)
        run: |
          # Both files are git-ignored and exist only on this runner.
          # List params must be a JSON array in .env files; a bare URL fails to
          # parse and the gateway then refuses every browser origin (fail closed).
          printf 'COACH_CORE_AI_ENABLED=false\nCOACH_CORE_ALLOWED_ORIGINS=["http://localhost:3000"]\n' > functions/.env.local
          printf 'COACH_CORE_OPENAI_API_KEY=e2e-placeholder-not-a-key\n' > functions/.secret.local
      - name: Reporter self-checks (annotation/summary contract, incl. empty jobs)
        run: npm --prefix e2e run test:reporter
      - name: Evidence self-checks (B15 retention contract)
        run: node e2e/scripts/evidence.test.mjs
      - name: Build web app for emulators (demo project)
        run: |
          npm --prefix e2e run build:app
          # B15 (2026-10-17): evidence that must survive the run lives in e2e/ci-evidence.
          # Playwright's "clear output" task deletes outputDir (e2e/test-results) at run
          # start, which previously destroyed run.log and the release manifest before upload.
          mkdir -p e2e/test-results e2e/ci-evidence
      - name: Build same-commit import-OFF emulator build (release proof L3 input; desktop acceptance jobs only)
        if: matrix.bucket == 'acceptance' && (matrix.project == 'chromium' || matrix.project == 'firefox')
        run: npm --prefix e2e run build:app:import-off
      - name: Release-proof self-checks (import default-OFF resolution, canary/source-scope, gate fail-closed cases, retired-model regressions)
        run: |
          set -o pipefail
          node scripts/security/release-import-config.test.mjs 2>&1 | tee /tmp/release-proof-selfchecks.txt
          # Accurate pass/fail/skip accounting as an annotation (job logs are not always reachable by reviewers).
          t=$(grep -E '^# tests ' /tmp/release-proof-selfchecks.txt | tail -1 | awk '{print $3}'); p=$(grep -E '^# pass ' /tmp/release-proof-selfchecks.txt | tail -1 | awk '{print $3}')
          f=$(grep -E '^# fail ' /tmp/release-proof-selfchecks.txt | tail -1 | awk '{print $3}'); k=$(grep -E '^# skipped ' /tmp/release-proof-selfchecks.txt | tail -1 | awk '{print $3}')
          sk=$(grep -E '^(ok|not ok) .* # SKIP' /tmp/release-proof-selfchecks.txt | sed -E 's/^(ok|not ok) ([0-9]+) - .*# SKIP ?/\2: /' | cut -c1-80 | tr '\n' ';')
          echo "::notice title=Release-proof self-checks (${{ matrix.bucket }} ${{ matrix.project }})::tests=${t} pass=${p} fail=${f} skipped=${k} (skipped tests are NOT passes): ${sk}"
      - name: Release-build proof L1+L2 (no hooks / emulator wiring in a staging-shaped build; import flag resolved OFF and inlined as import-config=false - no behavioural claim)
        env:
          MATRIX_PROJECT: ${{ matrix.project }}
          MATRIX_BUCKET: ${{ matrix.bucket }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # RELEASE_RETAIN_DIR (F3, 2026-10-18): the exact inspected release output (index.html, shipped
          # JS, asset-manifest.json, provenance) is kept under e2e/ci-evidence so B15 inventories,
          # hashes and uploads it. No source maps are generated; no .env* file is ever copied.
          RELEASE_BUILD_DIR=release-build RELEASE_MANIFEST=e2e/ci-evidence/release-build-manifest.sha256 \
          RELEASE_RETAIN_DIR=e2e/ci-evidence/release-build RELEASE_CANARY_JSON=e2e/ci-evidence/release-canary.json \
            bash scripts/security/verify-release-build.sh coach-core-mvp-staging-239
      - name: Run browser tests in the emulator suite
        env:
          REPEAT: ${{ github.event.inputs.repeat_each || '1' }}
          # Passed as data via env (never interpolated into the shell command).
          E2E_GREP: ${{ github.event.inputs.grep || '' }}
          E2E_BUCKET: ${{ matrix.bucket }}
          PROJECT: ${{ matrix.project }}
          # PR head (pull_request), queue head (merge_group) or the pushed/dispatched commit.
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          mkdir -p e2e/test-results e2e/ci-evidence
          # Provenance for the merge-eligibility aggregate: binds this job's evidence to the exact
          # commit, run attempt, event, project/bucket and selection inputs. Values are written with
          # printf %s from env (never interpolated into a command); the file is inventoried/hashed by B15.
          printf 'sha=%s\nhead_sha=%s\nevent=%s\nrun_id=%s\nrun_attempt=%s\nproject=%s\nbucket=%s\nrepeat=%s\ngrep=%s\n' \
            "$GITHUB_SHA" "$CANDIDATE_HEAD_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$PROJECT" "$E2E_BUCKET" "$REPEAT" "$E2E_GREP" > e2e/ci-evidence/run.context
          # evidence.sh tees to e2e/ci-evidence/run.log and exits with the TEST process's status.
          bash e2e/scripts/evidence.sh run e2e/ci-evidence -- \
            npx --prefix e2e firebase emulators:exec --project demo-coach-core-e2e \
            --only auth,firestore,functions \
            "npm --prefix e2e run test:browser -- --repeat-each=${REPEAT} --project=${PROJECT} --pass-with-no-tests"
      - name: Release proof L3 (real browser; import-OFF emulator build shows disabled behaviour; accepted D10-01/D10-02 on the opted-in build as ON control)
        if: matrix.bucket == 'acceptance' && (matrix.project == 'chromium' || matrix.project == 'firefox')
        env:
          RP_BROWSER: ${{ matrix.project }}
        run: |
          # Separate Playwright config and output dir: the B11 suite above is untouched. Both same-commit
          # builds are served side by side (:3100 import-OFF, :3000 opted-in). No tee of this run's
          # console (only the redacted main run.log is retained); results.json + gate JSON are the evidence.
          npx --prefix e2e firebase emulators:exec --project demo-coach-core-e2e \
            --only auth,firestore,functions \
            "npm --prefix e2e run test:release-proof:browser"
      - name: Release gate - L1 configuration + L2 inlining + L3 behaviour (refuses to PASS without executed browser evidence)
        if: always() && matrix.bucket == 'acceptance' && (matrix.project == 'chromium' || matrix.project == 'firefox')
        run: |
          set +e
          mkdir -p e2e/test-results/release-proof
          [ -f e2e/test-results-release-proof/results.json ] && cp e2e/test-results-release-proof/results.json e2e/test-results/release-proof/results.json
          node scripts/security/release-import-config.js gate --canary e2e/ci-evidence/release-canary.json \
            --off e2e/test-results-release-proof/results.json --on e2e/test-results-release-proof/results.json \
            --out e2e/ci-evidence/release-gate.json > /tmp/release-gate.out; st=$?
          v=$(node -e "const r=require('./e2e/ci-evidence/release-gate.json');console.log('verdict='+r.verdict+' off='+JSON.stringify((r.legs.behaviourOff||{}).executed||r.legs.behaviourOff)+' on='+JSON.stringify((r.legs.behaviourOnControl||{}).executed||r.legs.behaviourOnControl)+(r.reasons.length?' reasons='+r.reasons.join(' | '):''))" 2>/dev/null | cut -c1-1500)
          lvl=$([ "$st" -eq 0 ] && echo notice || echo error)
          echo "::${lvl} title=Release gate (${{ matrix.project }} ${{ matrix.bucket }})::${v}"
          exit $st
      - name: Release gate not run in this job (behavioural leg runs in desktop acceptance jobs only)
        if: always() && !(matrix.bucket == 'acceptance' && (matrix.project == 'chromium' || matrix.project == 'firefox'))
        run: echo "::notice title=Release gate (${{ matrix.project }} ${{ matrix.bucket }})::L1+L2 ran in this job; L3 (real-browser import-OFF run + ON control) and the gate verdict are issued only by the chromium/firefox acceptance jobs. This job makes no OFF-behaviour claim."
      - name: Emulator diagnostics (functions load/requests, no secrets)
        if: always()
        run: |
          f=e2e/ci-evidence/run.log
          [ -f "$f" ] || exit 0
          d=$(grep -E "functions|coachAI|Loaded functions|params|secret|Error" "$f" | grep -v "^\s*$" | tail -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
          echo "::notice title=E2E emulator log (functions)::${d}"
      - name: Browser versions
        if: always()
        run: |
          v=$(cd e2e && node -e "const {chromium,firefox}=require('@playwright/test');(async()=>{for(const b of [chromium,firefox]){const x=await b.launch();console.log(b.name()+' '+x.version());await x.close()}})()" | tr '\n' ' ')
          echo "::notice title=E2E browsers::${v} (Playwright 1.64.0; Linux; desktop viewport; no physical devices)"
      - name: Artifact manifest (file names, sizes and results.json digest; no contents)
        if: always()
        run: |
          d=e2e/test-results
          [ -d "$d" ] || { echo "::notice title=E2E artifact manifest (${{ matrix.bucket }} ${{ matrix.project }})::no test-results directory"; exit 0; }
          files=$(find "$d" -type f | wc -l); bytes=$(du -sb "$d" | cut -f1)
          digest=$([ -f "$d/results.json" ] && sha256sum "$d/results.json" | cut -c1-16 || echo none)
          tests=$([ -f "$d/results.json" ] && node -e "const r=require('./$d/results.json');const c=(s)=>s.specs.reduce((n,x)=>n+x.tests.reduce((m,t)=>m+t.results.length,0),0)+(s.suites||[]).reduce((n,x)=>n+c(x),0);console.log((r.suites||[]).reduce((n,s)=>n+c(s),0))" || echo 0)
          top=$(find "$d" -maxdepth 1 -mindepth 1 | sed "s#$d/##" | sort | head -40 | tr '\n' ',' | sed 's/,$//')
          echo "::notice title=E2E artifact manifest (${{ matrix.bucket }} ${{ matrix.project }})::files=${files} bytes=${bytes} results.json=${digest} executions_in_results_json=${tests} top-level: ${top}"
      - name: Finalize evidence (redact tokens, inventory with full SHA-256, fail closed on any processing error)
        id: finalize
        if: always()
        run: |
          set -e
          bash e2e/scripts/evidence.sh finalize e2e/ci-evidence e2e/test-results \
            e2e/ci-evidence/run.log e2e/ci-evidence/release-build-manifest.sha256 e2e/test-results/results.json
          test -s e2e/ci-evidence/UPLOAD_OK
          n=$(grep -vc '^#' e2e/ci-evidence/INVENTORY.sha256)
          r=$(cat e2e/ci-evidence/REDACTION.txt 2>/dev/null || echo "no run.log")
          echo "::notice title=E2E evidence inventory (${{ matrix.project }})::${n} files; ${r}; UPLOAD_OK present"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Evidence NOT uploaded (finalize failed; unsanitized or uninventoried evidence is never published)
        if: always() && steps.finalize.outputs.eligible != 'true'
        run: |
          echo "::error title=E2E evidence withheld (${{ matrix.project }})::finalize did not succeed, so no artifact is uploaded for this job. The browser-test step's own result is unchanged. Re-run after fixing the evidence pipeline."
          exit 1
      - uses: actions/upload-artifact@v4
        # Gate (Codex review of 04d4be8): runs on success AND failure of the tests, but ONLY when
        # finalize completed (redaction verified + inventory verified). always() alone would publish
        # an unsanitized log after a finalize failure.
        if: always() && steps.finalize.outputs.eligible == 'true'
        with:
          name: e2e-results-${{ matrix.bucket }}-${{ matrix.project }}-${{ github.sha }}
          path: |
            e2e/test-results
            e2e/ci-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Coach Core merge eligibility (2026-10-17): the ONE check to require. It succeeds only when
  # the complete required acceptance validation finished successfully on the exact candidate
  # commit, by reading what the twelve jobs above produced (job conclusions via the Actions API,
  # evidence artifacts with UPLOAD_OK + verified INVENTORY.sha256, run.context provenance, and a
  # source-derived --list membership on this very checkout). Rules R1-R7 are documented in
  # e2e/scripts/merge-eligibility.mjs. It cannot be satisfied by workflow_dispatch or push runs,
  # by a narrowed grep, by a cancelled/skipped/missing job, by artifacts from another sha or
  # attempt, or by zero tests posing as passes. Individual "E2E acceptance (*)" names remain
  # informative but are NOT sufficient as required checks (a one-test dispatch turns them green).
  # ---------------------------------------------------------------------------------------
  merge-eligibility:
    name: Coach Core merge eligibility
    needs: e2e
    # Runs after the matrix regardless of per-job results (diagnostic/obsolete failures are
    # expected to stay visible), but NEVER on a cancelled run: a cancelled run leaves no verdict,
    # so concurrency cancel-in-progress cannot strand a stale success on the commit.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e (for source-derived --list membership; no browsers)
        run: npm ci --prefix e2e --no-audit --no-fund
      - name: Gate self-checks (fixtures for success / failed / cancelled / skipped / missing / narrowed / empty / wrong sha)
        run: node e2e/scripts/merge-eligibility.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*-${{ github.sha }}
          path: gate/artifacts
          merge-multiple: false
      - name: Evaluate merge eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node e2e/scripts/merge-eligibility.mjs \
            --sha "$GITHUB_SHA" --head-sha "$CANDIDATE_HEAD_SHA" --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --artifacts gate/artifacts --e2e e2e --out gate/report --expected-repeat 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-eligibility-${{ github.sha }}
          path: gate/report
          if-no-files-found: error
          retention-days: 14
