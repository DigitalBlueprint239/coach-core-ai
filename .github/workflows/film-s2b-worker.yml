name: Film S2b worker (test-only)

# FILM-S2b (statement r2, #39 c-6294022891; authorization c-6294079240).
# Rebuilds the pinned FFmpeg 9.0.2 validator with the accepted S2a recipe
# (verify-source.sh + build.sh; provenance validated against SOURCE.json, so
# a digest change fails), then on synthetic media only:
#   1. limit calibration with the exact worker argv (TEST_MEASURED),
#   2. the pinned pipeline / limits / offender suite,
#   3. cross-boundary worker tests on the local Firestore emulator, and the
#      additive rules deny tests (Firestore + Storage emulators).
# Never deploys, never publishes, never reads secrets, never touches a real
# project or bucket, never runs real footage, never activates AI. The worker
# itself is TEST_ONLY and not exported from functions/index.js.

on:
  pull_request:
    paths:
      - 'functions/src/film/worker/**'
      - 'functions/test/film-worker*'
      - 'functions/test/worker-pinned/**'
      - 'functions/test/fixtures/s2b-media/**'
      - 'functions/test/emulator/film-s2b.emulator.test.js'
      - 'functions/scripts/film-worker-*'
      - 'tests/rules/film-worker.rules.test.mjs'
      - '.github/workflows/film-s2b-worker.yml'
  push:
    branches: [claude/film-s2b-worker]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-s2b-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    name: Rebuild pinned decoder (S2a recipe, digest-enforced)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build dependency (nasm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Verify source (PGP signature against the pinned key, sha256)
        run: bash tools/ffmpeg/verify-source.sh "$RUNNER_TEMP/ffwork"
      - name: Build (S2a recipe; provenance validated before upload)
        run: bash tools/ffmpeg/build.sh "$RUNNER_TEMP/ffwork"
      - name: Enforce SOURCE.json binary digests
        run: |
          set -euo pipefail
          node tools/ffmpeg/provenance.mjs validate "$RUNNER_TEMP/ffwork"
          want_ff=$(node -e "console.log(require('./tools/ffmpeg/SOURCE.json').expectedBinarySha256.ffmpeg)")
          want_fp=$(node -e "console.log(require('./tools/ffmpeg/SOURCE.json').expectedBinarySha256.ffprobe)")
          got_ff=$(sha256sum "$RUNNER_TEMP/ffwork/out/bin/ffmpeg" | cut -d' ' -f1)
          got_fp=$(sha256sum "$RUNNER_TEMP/ffwork/out/bin/ffprobe" | cut -d' ' -f1)
          [ "$want_ff" = "$got_ff" ] && [ "$want_fp" = "$got_fp" ] || { echo "::error title=Pinned digest mismatch::ffmpeg $got_ff ffprobe $got_fp"; exit 1; }
          echo "::notice title=Pinned decoder rebuilt (${{ github.sha }})::ffmpeg $got_ff ffprobe $got_fp"
      - uses: actions/upload-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/ffwork/out/bin/
          if-no-files-found: error
          retention-days: 3

  pinned:
    name: Calibration + pinned pipeline/limits suite
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Decoder + prlimit present
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          sha256sum "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          prlimit --version
      - name: Calibration (exact worker argv, 3 runs per command, pinned; committed limits must still hold)
        env:
          PINNED: '1'
          CHECK_COMMITTED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
        run: |
          set -euo pipefail
          mkdir -p s2b-evidence
          node functions/scripts/film-worker-calibrate.js s2b-evidence/calibration.json \
            2> s2b-evidence/calibration.stderr | tee s2b-evidence/calibration.compact.json \
            || { echo "::error title=Calibration failed (${{ github.sha }})::$(tail -c 1800 s2b-evidence/calibration.stderr | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Worker calibration (pinned ${{ github.sha }})::$(cat s2b-evidence/calibration.compact.json)"
          echo "::notice title=Calibration diagnostic + committed-limit check::$(tr '\n' ' ' < s2b-evidence/calibration.stderr)"
          # every measured row (step|fixture|cmd|minAsMiB|cpuMs|wallMs|rssMiB), chunked
          split -l 45 s2b-evidence/calibration.rows.txt s2b-evidence/rows-
          for f in s2b-evidence/rows-*; do
            echo "::notice title=Calibration rows ($(basename "$f"))::$(tr '\n' ';' < "$f")"
          done
      - name: Pinned pipeline / limits / offender suite (exit retained)
        env:
          PINNED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
          ANNOTATE_LABEL: 'S2b pinned'
        run: |
          set +e
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout \
            functions/test/worker-pinned/film-worker-pinned.test.js 2>&1 | tee s2b-evidence/pinned.log
          st=${PIPESTATUS[0]}
          echo "exit=$st" | tee -a s2b-evidence/pinned.log
          exit "$st"
      - name: Retain evidence (synthetic media facts only; no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2b-pinned-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: s2b-evidence/
          if-no-files-found: warn
          retention-days: 14

  emulator:
    name: Cross-boundary (Firestore emulator) + rules deny tests
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/rules/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - name: Install dependencies (functions + emulator tooling)
        run: |
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix tests/rules --no-audit --no-fund
      - name: Worker cross-boundary tests (S1 handlers -> worker, Firestore emulator)
        env:
          PINNED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
          ANNOTATE_LABEL: 'S2b emulator'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          functions/test/emulator/film-s2b.emulator.test.js"
      - name: Additive rules deny tests for worker paths (rules unchanged)
        env:
          ANNOTATE_LABEL: 'S2b rules deny'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore,storage
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          tests/rules/film-worker.rules.test.mjs"
