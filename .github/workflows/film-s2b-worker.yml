name: Film S2b worker (test-only)

# FILM-S2b (statement r2, #39 c-6294022891; authorization c-6294079240).
# Rebuilds the pinned FFmpeg 9.0.2 validator with the accepted S2a recipe
# (verify-source.sh + build.sh; provenance validated against SOURCE.json, so
# a digest change fails), then on synthetic media only:
#   1. limit calibration with the exact worker argv (TEST_MEASURED),
#   2. the pinned pipeline / limits / offender suite,
#   3. cross-boundary worker tests on the local Firestore emulator, and the
#      additive rules deny tests (Firestore + Storage emulators).
# Never deploys, never publishes, never reads secrets, never touches a real
# project or bucket, never runs real footage, never activates AI. The worker
# itself is TEST_ONLY and not exported from functions/index.js.

on:
  pull_request:
    paths:
      - 'functions/src/film/worker/**'
      - 'functions/test/film-worker*'
      - 'functions/test/worker-pinned/**'
      - 'functions/test/fixtures/s2b-media/**'
      - 'functions/test/emulator/film-s2b.emulator.test.js'
      - 'functions/scripts/film-worker-*'
      - 'tests/rules/film-worker.rules.test.mjs'
      - '.github/workflows/film-s2b-worker.yml'
  push:
    branches: [claude/film-s2b-worker, codex/film-validator-budget-c8526787]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-s2b-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/codex/film-validator-budget-c8526787' }}
    name: Rebuild pinned decoder (S2a recipe, digest-enforced)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build dependency (nasm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Verify source (PGP signature against the pinned key, sha256)
        run: bash tools/ffmpeg/verify-source.sh "$RUNNER_TEMP/ffwork"
      - name: Build (S2a recipe; provenance validated before upload)
        run: bash tools/ffmpeg/build.sh "$RUNNER_TEMP/ffwork"
      - name: Enforce SOURCE.json binary digests
        run: |
          set -euo pipefail
          node tools/ffmpeg/provenance.mjs validate "$RUNNER_TEMP/ffwork"
          want_ff=$(node -e "console.log(require('./tools/ffmpeg/SOURCE.json').expectedBinarySha256.ffmpeg)")
          want_fp=$(node -e "console.log(require('./tools/ffmpeg/SOURCE.json').expectedBinarySha256.ffprobe)")
          got_ff=$(sha256sum "$RUNNER_TEMP/ffwork/out/bin/ffmpeg" | cut -d' ' -f1)
          got_fp=$(sha256sum "$RUNNER_TEMP/ffwork/out/bin/ffprobe" | cut -d' ' -f1)
          [ "$want_ff" = "$got_ff" ] && [ "$want_fp" = "$got_fp" ] || { echo "::error title=Pinned digest mismatch::ffmpeg $got_ff ffprobe $got_fp"; exit 1; }
          echo "::notice title=Pinned decoder rebuilt (${{ github.sha }})::ffmpeg $got_ff ffprobe $got_fp"
      - uses: actions/upload-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/ffwork/out/bin/
          if-no-files-found: error
          retention-days: 3

  pinned:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/codex/film-validator-budget-c8526787' }}
    name: Calibration + pinned pipeline/limits suite
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Decoder + prlimit present
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          sha256sum "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          prlimit --version
      - name: Calibration (exact worker argv, 3 runs per command, pinned; committed limits must still hold)
        env:
          PINNED: '1'
          CHECK_COMMITTED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
        run: |
          set -euo pipefail
          mkdir -p s2b-evidence
          node functions/scripts/film-worker-calibrate.js s2b-evidence/calibration.json \
            2> s2b-evidence/calibration.stderr | tee s2b-evidence/calibration.compact.json \
            || { echo "::error title=Calibration failed (${{ github.sha }})::$(tail -c 1800 s2b-evidence/calibration.stderr | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Worker calibration (pinned ${{ github.sha }})::$(cat s2b-evidence/calibration.compact.json)"
          echo "::notice title=Calibration diagnostic + committed-limit check::$(tr '\n' ' ' < s2b-evidence/calibration.stderr)"
          # every measured row (step|fixture|cmd|minAsMiB|cpuMs|wallMs|rssMiB), chunked
          split -l 45 s2b-evidence/calibration.rows.txt s2b-evidence/rows-
          for f in s2b-evidence/rows-*; do
            echo "::notice title=Calibration rows ($(basename "$f"))::$(tr '\n' ';' < "$f")"
          done
      - name: Pinned pipeline / limits / offender suite (exit retained)
        env:
          PINNED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
          ANNOTATE_LABEL: 'S2b pinned'
        run: |
          set +e
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout \
            functions/test/worker-pinned/film-worker-pinned.test.js 2>&1 | tee s2b-evidence/pinned.log
          st=${PIPESTATUS[0]}
          echo "exit=$st" | tee -a s2b-evidence/pinned.log
          exit "$st"
      - name: Retain evidence (synthetic media facts only; no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2b-pinned-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: s2b-evidence/
          if-no-files-found: warn
          retention-days: 14

  emulator:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/codex/film-validator-budget-c8526787' }}
    name: Cross-boundary (Firestore emulator) + rules deny tests
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/rules/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: s2b-decoder-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - name: Install dependencies (functions + emulator tooling)
        run: |
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix tests/rules --no-audit --no-fund
      - name: Worker cross-boundary tests (S1 handlers -> worker, Firestore emulator)
        env:
          PINNED: '1'
          FFMPEG_BIN: ${{ runner.temp }}/bin/ffmpeg
          FFPROBE_BIN: ${{ runner.temp }}/bin/ffprobe
          ANNOTATE_LABEL: 'S2b emulator'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          functions/test/emulator/film-s2b.emulator.test.js"
      - name: Additive rules deny tests for worker paths (rules unchanged)
        env:
          ANNOTATE_LABEL: 'S2b rules deny'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore,storage
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          tests/rules/film-worker.rules.test.mjs"

  private-setup:
    if: ${{ github.repository == 'DigitalBlueprint239/coach-core-ai' && github.event_name == 'push' && github.ref == 'refs/heads/codex/film-validator-budget-c8526787' && github.actor == 'DigitalBlueprint239' && github.run_attempt == 1 && !github.event.deleted }}
    name: Private synthetic journey / unchanged application candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    environment:
      name: film-private-ci-c8526787
      deployment: false
    concurrency:
      group: film-private-setup-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Require protected environment configuration
        env:
          ASSET_ID: '682470270'
          COST_ASSET_ID: ${{ vars.FILM_COST_EVIDENCE_ASSET_ID }}
          COST_SHA256: ${{ vars.FILM_COST_EVIDENCE_SHA256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = DigitalBlueprint239/coach-core-ai
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$COST_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$COST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/film-private-setup/evidence"
      - name: Fetch only the hash-pinned public setup script at this commit
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          SCRIPT="$RUNNER_TEMP/film-private-setup/film-private-setup.sh"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 --retry 2 \
            --output "$SCRIPT" \
            "https://raw.githubusercontent.com/DigitalBlueprint239/coach-core-ai/$GITHUB_SHA/.github/scripts/film-private-setup.sh"
          echo '15399f2ab9009d2fc854f789cf28771838a6d83a9955aae3b1b88300ac6394d6  '"$SCRIPT" | sha256sum -c -
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # No cache: package/decoder/evidence stay on temporary runner disk.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sanitized protected access diagnostic (no private response output)
        env:
          GH_TOKEN: ${{ secrets.FILM_PRIVATE_TRANSFER_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const results = [];
          const token = process.env.GH_TOKEN || '';
          function save() { fs.writeFileSync(process.env.RUNNER_TEMP+'/film-private-setup/evidence/access-diagnostic.json',JSON.stringify(results,null,2)+'\n'); }
          function report(endpoint,status,category) { const row={endpoint,status,category};results.push(row);save();console.log(JSON.stringify(row)); }
          async function check(label,path,validate) {
           let r,data;
           try {
            r=await fetch('https://api.github.com/'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Film-bounded-diagnostic'},redirect:'error',signal:AbortSignal.timeout(30000)});
            try {data=await r.json();} catch {report(label,r.status,'invalid-api-response');return false;}
           } catch {report(label,0,'network-or-redirect-error');return false;}
           let category='unexpected-http-status';
           if(r.status===200)category=validate(data)?'ok':'identity-or-metadata-mismatch';
           else if(r.status===401)category='authentication-rejected';
           else if(r.status===404)category='resource-not-visible-to-credential';
           else if(r.status===403) {
            const m=typeof data.message==='string'?data.message:'';
            category=/saml|sso/i.test(m)?'sso-policy-denied':r.headers.get('x-ratelimit-remaining')==='0'?'rate-limit-denied':'permission-or-access-policy-denied';
           }
           report(label,r.status,category);return category==='ok';
          }
          (async()=>{
           if(!/^github_pat_[A-Za-z0-9_]+$/.test(token)){report('credential',0,token?'invalid-fine-grained-token-format':'missing-environment-secret');process.exitCode=1;return;}
           const repo='repos/DigitalBlueprint239/Coach-Core-Smart-Playbook-';
           for(const [label,path,validate] of [
            ['account','user',d=>d.login==='DigitalBlueprint239'],
            ['repository',repo,d=>d.private===true&&d.full_name==='DigitalBlueprint239/Coach-Core-Smart-Playbook-'],
            ['release',repo+'/releases/424529110',d=>d.draft===true&&d.tag_name==='film-private-setup-c8526787'],
            ['package-asset',repo+'/releases/assets/682470270',d=>d.id===682470270&&d.digest==='sha256:7ae6153d24480a8be6c240f5bd9d90649b5a4434c3de18b03172b321642c3683'],
            ['cost-asset',repo+'/releases/assets/678838152',d=>d.id===678838152&&d.digest==='sha256:6bf52693513c6a0f869f4f2a11cd87ed8335a1905952e93a0cfbafe7fa4145b3']
           ]) { if(!await check(label,path,validate)){process.exitCode=1;return;} }
          })().catch(()=>{report('diagnostic',0,'internal-diagnostic-error');process.exitCode=1;});
          NODE
      - name: Fetch private handoff with step-scoped credential
        env:
          GH_TOKEN: ${{ secrets.FILM_PRIVATE_TRANSFER_TOKEN }}
          ASSET_ID: '682470270'
          COST_ASSET_ID: ${{ vars.FILM_COST_EVIDENCE_ASSET_ID }}
          COST_SHA256: ${{ vars.FILM_COST_EVIDENCE_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          E="$RUNNER_TEMP/film-private-setup/evidence"
          test -d "$E"
          trap 'code=$?; printf "private-transport exit=%s\n" "$code" >> "$E/exits.txt"; printf "private-transport: exit=%s (details private)\n" "$code"; exit "$code"' EXIT
          (
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN"
          # Existing repository must still be private. Do not print its metadata.
          gh api repos/DigitalBlueprint239/Coach-Core-Smart-Playbook- --jq .private | grep -qx true
          gh api -H 'Accept: application/octet-stream' \
            "repos/DigitalBlueprint239/Coach-Core-Smart-Playbook-/releases/assets/$ASSET_ID" \
            > "$RUNNER_TEMP/film-private-setup/package.zip"
          gh api -H 'Accept: application/octet-stream' \
            "repos/DigitalBlueprint239/Coach-Core-Smart-Playbook-/releases/assets/682837144" \
            > "$RUNNER_TEMP/film-private-setup/journey-driver.zip"
          echo '29659654b7b6c2fc71542f1b104da1238c58e7ce6a52789cb673275305478280  '"$RUNNER_TEMP/film-private-setup/journey-driver.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/film-private-setup/journey-driver.zip" <<'PY'
          import sys,zipfile,stat
          with zipfile.ZipFile(sys.argv[1]) as z:
              entries=z.infolist()
              expected=['MANIFEST.json','README.md','bootstrap-probe.cjs','browser-host.cjs','build.cjs','client.jsx','guard.cjs','guard.test.cjs','run.cjs']
              assert len(entries)==9 and sorted(e.filename for e in entries)==expected
              assert sum(e.file_size for e in entries)<1000000
              assert all(not e.is_dir() and not stat.S_ISLNK(e.external_attr >>16) and not(e.flag_bits &1) for e in entries)
          PY
          mkdir "$RUNNER_TEMP/film-private-setup/journey-driver"
          unzip -q "$RUNNER_TEMP/film-private-setup/journey-driver.zip" -d "$RUNNER_TEMP/film-private-setup/journey-driver"
          # A separate frozen rules overlay; source R2 and harness remain unchanged.
          gh api -H 'Accept: application/octet-stream' \
            "repos/DigitalBlueprint239/Coach-Core-Smart-Playbook-/releases/assets/683016418" \
            > "$RUNNER_TEMP/film-private-setup/rules-overlay.zip"
          echo '11dd05f85802f905ccb2311eb4c38303c0351a95e5432559c1bbb4549b98191c  '"$RUNNER_TEMP/film-private-setup/rules-overlay.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/film-private-setup/rules-overlay.zip" <<'PY'
          import sys,zipfile,stat
          with zipfile.ZipFile(sys.argv[1]) as z:
              entries=z.infolist()
              expected=['MANIFEST.json','film-link-budget.rules.test.mjs','film-link-runtime.json','firestore.rules']
              assert len(entries)==4 and sorted(e.filename for e in entries)==expected
              assert sum(e.file_size for e in entries)<1000000
              assert all(not e.is_dir() and not stat.S_ISLNK(e.external_attr >>16) and not(e.flag_bits &1) for e in entries)
          PY
          mkdir "$RUNNER_TEMP/film-private-setup/rules-overlay"
          unzip -q "$RUNNER_TEMP/film-private-setup/rules-overlay.zip" -d "$RUNNER_TEMP/film-private-setup/rules-overlay"
          cd "$RUNNER_TEMP/film-private-setup"
          echo '7ae6153d24480a8be6c240f5bd9d90649b5a4434c3de18b03172b321642c3683  package.zip' | sha256sum -c -
          mkdir package
          unzip -q package.zip -d package
          cd package
          sha256sum -c SHA256SUMS.txt > ../evidence/package-verification.log
          mkdir source
          tar -xf candidate-source.tar -C source
          gh api -H 'Accept: application/octet-stream' \
            "repos/DigitalBlueprint239/Coach-Core-Smart-Playbook-/releases/assets/$COST_ASSET_ID" \
            > ../evidence/zero-spend-evidence.json
          echo "$COST_SHA256  ../evidence/zero-spend-evidence.json" | sha256sum -c - > ../evidence/cost-hash-check.log
          # Owner must check the actual account control BEFORE publishing this
          # branch. This verifies its bound evidence; it cannot query billing.
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('../evidence/zero-spend-evidence.json'));
          const c=e.control||{};
          if(e.account!=='DigitalBlueprint239'||c.product!=='Actions'||c.limitUSD!==0||
             c.stopUsage!==true||c.existing!==true||c.scope!=='account'||c.allOwnedRepositories!==true||
             c.coversRepository!=='DigitalBlueprint239/coach-core-ai'||
             !/^[a-f0-9]{64}$/.test(e.redactedAccountEvidenceSha256||'')||
             e.evidenceSource!=='direct_user_statement'||!e.verifiedBy||!Number.isFinite(Date.parse(e.recordedAt))||
             Date.parse(e.recordedAt)>Date.now()){
            throw Error('Owner cost-control evidence invalid; refuse execution');
          }
          NODE
          ) > "$E/private-transport.log" 2>&1

      - name: Disposable build prerequisites
        run: |
          set -euo pipefail
          # Same existing accepted CI prerequisite, confined to this hosted VM.
          E="$RUNNER_TEMP/film-private-setup/evidence"
          set +e
          sudo apt-get update -qq > "$E/apt-update.log" 2>&1
          code=$?
          printf 'sudo apt-get update -qq exit=%s\n' "$code" >> "$E/exits.txt"
          if [[ "$code" != 0 ]]; then exit "$code"; fi
          sudo apt-get install -y -qq nasm > "$E/apt-nasm.log" 2>&1
          code=$?
          printf 'sudo apt-get install -y -qq nasm exit=%s\n' "$code" >> "$E/exits.txt"
          exit "$code"
      - name: Set up exact source/dependencies and qualify bounded worker
        run: |
          set -euo pipefail
          umask 077
          E="$RUNNER_TEMP/film-private-setup/evidence"
          test -d "$E"
          trap 'code=$?; printf "qualification exit=%s\n" "$code" >> "$E/exits.txt"; printf "qualification: exit=%s (details private)\n" "$code"; exit "$code"' EXIT
          (
          bash "$RUNNER_TEMP/film-private-setup/film-private-setup.sh"
          ) > "$E/qualification.log" 2>&1

      - name: Retain only private evidence (no Actions artifacts or caches)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FILM_PRIVATE_TRANSFER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          E="$RUNNER_TEMP/film-private-setup/evidence"
          test -d "$E"
          trap 'code=$?; printf "evidence-upload exit=%s\n" "$code" >> "$E/exits.txt"; printf "evidence-upload: exit=%s (details private)\n" "$code"; exit "$code"' EXIT
          (
          set -euo pipefail
          P="$RUNNER_TEMP/film-private-setup"
          test -d "$P/evidence"
          # The fixed private prerelease already exists from package staging.
          gh api repos/DigitalBlueprint239/Coach-Core-Smart-Playbook- --jq .private | grep -qx true
          tar -czf "$P/setup-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz" -C "$P" evidence
          ARCHIVE="$P/setup-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          RECEIPT="$P/setup-receipt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          set +e
          gh release upload film-private-setup-c8526787 "$ARCHIVE" \
            --repo DigitalBlueprint239/Coach-Core-Smart-Playbook- > "$P/archive-upload.log" 2>&1
          archive_code=$?
          set -e
          sha256sum "$ARCHIVE" > "$RECEIPT"
          printf 'archive-upload exit=%s\n' "$archive_code" >> "$RECEIPT"
          cat "$P/archive-upload.log" >> "$RECEIPT"
          # Receipt is attempted even after archive failure; neither failure is suppressed.
          set +e
          gh release upload film-private-setup-c8526787 "$RECEIPT" \
            --repo DigitalBlueprint239/Coach-Core-Smart-Playbook- > "$P/receipt-upload.log" 2>&1
          receipt_code=$?
          set -e
          if [[ "$archive_code" != 0 ]]; then exit "$archive_code"; fi
          if [[ "$receipt_code" != 0 ]]; then exit "$receipt_code"; fi
          echo 'Evidence and receipt retained privately; consult private journey verdict.'
          ) > "$RUNNER_TEMP/film-private-setup/evidence-upload.log" 2>&1

      - name: Remove only this job's private temporary directory
        if: always()
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/film-private-setup"
          [[ "$P" = "$RUNNER_TEMP/film-private-setup" && "$P" != / ]]
          if [[ -f "$P/decoder-workdir-owned" ]]; then
            W="$RUNNER_TEMP/ffwork"
            [[ "$W" = /home/runner/work/_temp/ffwork ]]
            rm -rf -- "$W"
          fi
          rm -rf -- "$P"
