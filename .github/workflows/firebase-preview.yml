name: Firebase preview link

# SECURITY HOLD 2026-11-06: Do NOT deploy PR preview channels to the production
# Firebase project. Retain the required "preview" CI job so branch-protection
# checks can pass safely. The job has no Firebase credentials or deploy commands.
# PR #125 will replace this only AFTER the isolated staging project is ready.
on:
  pull_request:
    branches: [recovery/coach-core-mvp-2026]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy preview deploy is disabled
        run: |
          echo "Preview deployment intentionally suspended for security."
          echo "A pull request status check is provided; no Hosting deploy occurs."
