name: Film S1-C1 cleanup (test-only)

# FILM-S1-C1 (proposal r3 #39 c-6299776477 + T7-0 clarification
# c-6299971919; owner authorization C1-A c-6300236512). Runs ONLY the
# affected focused S1 suites and the new C1 tests, on synthetic objects:
#   1. frozen-surface proof against r4 6764af9 (git diff --exit-code),
#   2. focused unit tests (doubles with real generation semantics) + lint,
#   3. Firestore emulator: C1 query/transaction tests, the affected S1
#      handler emulator suite (Firestore + Storage), additive rules denies.
# Never deploys, never reads secrets, never touches a real project or
# bucket, never exports or schedules the sweep, never activates AI.

on:
  pull_request:
    paths:
      - 'functions/src/film/cleanup.js'
      - 'functions/src/film/handlers.js'
      - 'functions/index.js'
      - 'functions/scripts/film-terms-guard.js'
      - 'functions/test/film-s1-cleanup*'
      - 'functions/test/film-cleanup-doubles.js'
      - 'functions/test/emulator/film-s1*.js'
      - 'tests/rules/film-cleanup.rules.test.mjs'
      - '.github/workflows/film-s1-c1-cleanup.yml'
  push:
    branches: [claude/film-s1-cleanup-repair]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-s1-c1-cleanup-${{ github.ref }}
  cancel-in-progress: true

env:
  R4_BASE: 6764af9edd7ab258f55c4eeb19e80a4649b8c86b

jobs:
  frozen:
    name: Frozen surfaces unchanged vs r4 6764af9
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: git diff --exit-code against the agreed base
        run: |
          set -euo pipefail
          git cat-file -e "$R4_BASE^{commit}"
          git diff --exit-code "$R4_BASE" -- \
            functions/src/film/contract.js functions/src/film/contract-v2.js \
            functions/src/film/legacy-r3.js functions/src/film/storage-adapter.js \
            functions/src/film/limits.js functions/src/film/terms.js \
            tests/fixtures/coach-film.v1 tests/fixtures/coach-film.v2 \
            src/features/film-analyzer firestore.rules storage.rules firebase.json \
            firestore.indexes.json tools/ffmpeg package-lock.json \
            functions/package-lock.json tests/rules/package-lock.json \
            functions/package.json tests/rules/package.json .github/scripts \
            .github/workflows/security-rules.yml .github/workflows/e2e-emulator.yml
          test ! -e functions/src/film/worker
          changed=$(git diff --name-only "$R4_BASE" HEAD | tr '\n' ' ')
          echo "::notice title=S1-C1 frozen check (${{ github.sha }})::frozen paths byte-unchanged vs $R4_BASE; changed: $changed"

  focused:
    name: Focused S1-C1 unit tests + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-coach-core-beta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm --prefix functions run lint
      - name: C1 + affected S1 unit suites
        env:
          ANNOTATE_LABEL: 'S1-C1 focused'
        working-directory: functions
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=../.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          test/film-s1-cleanup.test.js test/film-s1-cleanup-review-r1r2.test.js
          test/film-s1.test.js

  emulator:
    name: Firestore/Storage emulator (C1 + affected S1) + rules deny
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/rules/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix tests/rules --no-audit --no-fund
      - name: C1 emulator tests (real transactions and query semantics)
        env:
          ANNOTATE_LABEL: 'S1-C1 emulator'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore,storage
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          functions/test/emulator/film-s1-cleanup.emulator.test.js
          functions/test/emulator/film-s1.emulator.test.js"
      - name: Additive rules deny tests (rules unchanged)
        env:
          ANNOTATE_LABEL: 'S1-C1 rules deny'
        run: >-
          npx --prefix tests/rules firebase emulators:exec
          --project demo-coach-core-beta --only firestore
          "node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/scripts/annotate-reporter.mjs --test-reporter-destination=stdout
          tests/rules/film-cleanup.rules.test.mjs"
