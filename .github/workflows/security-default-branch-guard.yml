name: Default branch deployment safety checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch only audited source via read-only GitHub Contents API
        # The historical default branch has a malformed gitlink which prevents
        # a normal git checkout. Do not grant deploy credentials to bypass it.
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for file in \
            .firebaserc \
            .github/workflows/model-optimization.yml \
            scripts/deploy.sh \
            scripts/rollback.sh \
            scripts/tests/legacy-deploy-disabled.test.mjs \
            src/components/SmartPlaybook/scripts/deploy.sh
          do
            mkdir -p "$(dirname "$file")"
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/$file?ref=$REVISION" > "$file"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired cloud deployment scripts fail closed
        run: node --test scripts/tests/legacy-deploy-disabled.test.mjs
      - name: Verify no implicit Firebase production default
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
            if (rc.projects?.default) process.exit(1);
          "
      - name: Verify no automatic Firestore mutation in legacy model pipeline
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const y=fs.readFileSync('.github/workflows/model-optimization.yml','utf8');
            if (y.includes('config_ref.set(')) process.exit(1);
          "
