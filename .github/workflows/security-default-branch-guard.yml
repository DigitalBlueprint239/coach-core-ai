name: Default branch deployment safety checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Legacy master has a malformed gitlink unrelated to these safety checks.
          # Limit checkout to the relevant paths, without touching legacy submodules.
          sparse-checkout: |
            .firebaserc
            .github/workflows
            scripts
            src/components/SmartPlaybook/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired cloud deployment scripts fail closed
        run: node --test scripts/tests/legacy-deploy-disabled.test.mjs
      - name: Verify no implicit Firebase production default
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8'));
            if (rc.projects?.default) process.exit(1);
          "
      - name: Verify no automatic Firestore mutation in legacy model pipeline
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const y=fs.readFileSync('.github/workflows/model-optimization.yml','utf8');
            if (y.includes('config_ref.set(')) process.exit(1);
          "
